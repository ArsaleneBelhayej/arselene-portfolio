<section class="technologies" id="technologies">
  <div class="container">
    <div class="section-box">
      <div class="technologies-title" data-aos="fade-up">
        <h3 class="section-title">
          <span class="n-section-title">03.</span> {{"Technologies.Title" | translate}}
        </h3>
      </div>

      <div class="tools-grid">
        <ng-container *ngFor="let tool of tools">
          <a
            class="tool-item"
            [style.backgroundColor]="tool.color || '#fff'"
            target="_blank"
            rel="noopener"
            [href]="tool.link"
          >
            <img
              class="tool-logo"
              [src]="tool.logo"
              [alt]="tool.name"
              [style.backgroundColor]="tool.color || '#fff'"
            />
            <span
              class="tool-name"
              [style.color]="tool.color ? '#fff' : '#333'"
              >{{ tool.name }}</span
            >
          </a>
        </ng-container>
      </div>
    </div>
  </div>
</section>
