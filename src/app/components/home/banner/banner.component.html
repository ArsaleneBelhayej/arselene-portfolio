<section class="section banner">
  <div [@bannerTrigger] class="container">
    <div class="section-box-banner">
      <div class="content">
        <div>
          <h1>{{"Banner.Pretitle" | translate}}</h1>
        </div>
        <div class="banner-title">
          <div class="name-container">
            <h2 [class.gradient-text-name]="isNameActive">Arselene Belhayej.</h2>
            <button class="play-audio-btn" (click)="playAudio()" title="Play Pronunciation">
              <i class="fas fa-volume-up"></i>
            </button>
          </div>
          <h3 [class.gradient-text-title]="isTitleActive">{{"Banner.Postitle" | translate}}</h3>
        </div>
        <div class="banner-description">
          <p [innerHTML]='"Banner.Description" | translate' class="mt-4"></p>
        </div>
      </div>
      <div class="div-btn-banner">
        <a
          (click)="analyticsService.sendAnalyticEvent('click_send_mail', 'banner', 'email')"
          href="mailto:arselenebelhayej1@gmail.com"
          target="_black"
          class="main-btn"
        >
          {{"Banner.ActionBtn" | translate}}
        </a>
        <a
          href="https://www.linkedin.com/in/arselenebelhayej/"
          target="_blank"
          title="LinkedIn"
          aria-label="LinkedIn"
          class="main-btn icon-wrapper"
        >
          <i class="fab fa-linkedin"></i>
        </a>
        <a
          href="https://github.com/ArsaleneBelhayej"
          target="_blank"
          title="GitHub"
          aria-label="GitHub"
          class="main-btn icon-wrapper"
        >
          <i class="fab fa-github"></i>
        </a>
      </div>
    </div>
  </div>
</section>
